services:
  - type: web
    name: tell5-bot
    runtime: image
    dockerfilePath: services/whatsapp/Dockerfile
    envVars:
      - key: API_URL
        value: https://tell5-web-734407983511.us-central1.run.app
      - key: BAILEYS_WEBHOOK_SECRET
        sync: false
      - key: BOT_PORT
        value: "10000"
    disk:
      name: baileys-auth
      mountPath: /app/auth
      sizeGB: 1
