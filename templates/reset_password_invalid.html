<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Invalid Reset Link — Tell5</title>
  <meta name="theme-color" content="#060809"/>
  <link rel="icon" href="/static/tell5-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cabinet+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#060809;--s1:#0b1118;--b1:#1c2c3c;--ac:#00e5b0;--t1:#eaf2fb;--t2:#9ab4c8;--t3:#4e6a80;--mono:'IBM Plex Mono',monospace;--sans:'Cabinet Grotesk',sans-serif}
    body{background:var(--bg);color:var(--t1);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:36px 32px;width:100%;max-width:400px;margin:24px;text-align:center}
    .icon{font-size:2rem;margin-bottom:16px;opacity:.4}
    h1{font-size:1.3rem;font-weight:900;margin-bottom:8px}
    p{font-size:.82rem;color:var(--t2);line-height:1.6;margin-bottom:24px}
    a{display:inline-block;padding:12px 24px;border-radius:8px;background:var(--ac);color:#04060a;font-weight:800;text-decoration:none;font-size:.88rem}
    a:hover{opacity:.85}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🔗</div>
    <h1>Link expired or invalid</h1>
    <p>This password reset link is no longer valid. It may have expired or already been used.</p>
    <a href="/">Back to login</a>
  </div>
</body>
</html>
