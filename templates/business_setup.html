<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Profile — Tell5</title>
  <link rel="icon" href="/static/tell5-icon.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cabinet+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060809; --surface: #0c1014; --surface2: #111820;
      --border: #1a2330; --border2: #243040; --muted: #1e2d3d;
      --text: #e8f0f8; --sub: #5a7a94; --sub2: #8aa0b4;
      --accent: #00e5b0; --blue: #3b82f6; --orange: #f97316; --danger: #ef4444;
      --r: 14px; --r-sm: 8px;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: radial-gradient(circle, rgba(0,229,176,0.05) 1px, transparent 1px);
      background-size: 28px 28px; pointer-events: none; z-index: 0;
    }
    body {
      background: var(--bg); color: var(--text); font-family: 'Cabinet Grotesk', sans-serif;
      min-height: 100vh; padding: 40px 20px; position: relative; z-index: 1;
    }
    .shell { max-width: 680px; margin: 0 auto; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 32px; margin-bottom: 16px;
    }
    h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: -0.04em; color: var(--accent); margin-bottom: 4px; }
    .sub { color: var(--sub2); font-size: 0.85rem; margin-bottom: 24px; line-height: 1.6; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--sub); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 14px; border-radius: var(--r-sm); border: 1px solid var(--border2);
      background: var(--bg); color: var(--text); font-size: 0.85rem; outline: none;
      font-family: 'Cabinet Grotesk', sans-serif; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field textarea { min-height: 80px; resize: vertical; }
    .field select { cursor: pointer; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn {
      padding: 12px 24px; border-radius: var(--r-sm); font-weight: 800; cursor: pointer;
      border: none; font-size: 0.9rem; transition: all 0.15s; font-family: 'Cabinet Grotesk', sans-serif;
    }
    .btn-primary { background: var(--accent); color: #060809; }
    .btn-primary:hover { background: #1fffd0; box-shadow: 0 6px 24px rgba(0,229,176,0.3); }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border2); }
    .btn-row { display: flex; gap: 10px; margin-top: 8px; }
    .toast {
      padding: 12px 16px; border-radius: var(--r-sm); margin-bottom: 16px;
      font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; display: none;
    }
    .toast.show { display: block; }
    .toast-success { background: rgba(0,229,176,0.1); color: var(--accent); border: 1px solid rgba(0,229,176,0.2); }
    .toast-error { background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
    .nav-back { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--accent); text-decoration: none; margin-bottom: 20px; display: inline-block; }
    .nav-back:hover { text-decoration: underline; }
    .product-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 14px;
      background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm);
      margin-bottom: 8px;
    }
    .product-item .name { flex: 1; font-weight: 600; }
    .product-item .price { font-family: 'IBM Plex Mono', monospace; color: var(--accent); font-size: 0.8rem; }
    .product-item .del { color: var(--danger); cursor: pointer; font-size: 0.8rem; background: none; border: none; }
    .inline-form { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .inline-form input { flex: 1; min-width: 100px; padding: 8px 12px; border-radius: var(--r-sm); border: 1px solid var(--border2); background: var(--bg); color: var(--text); font-size: 0.8rem; }
    .inline-form button { padding: 8px 16px; border-radius: var(--r-sm); border: none; background: var(--accent); color: #060809; font-weight: 700; cursor: pointer; }
    #profile-url { margin-top: 12px; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-sm); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; text-align: center; display: none; }
    #profile-url a { color: var(--accent); }
    .char-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--sub); text-align: right; margin-top: 4px; }
    .char-count.warn { color: var(--orange); }
    .char-count.over { color: var(--danger); }
    .image-upload { border: 2px dashed var(--border2); border-radius: var(--r-sm); padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; margin-bottom: 16px; }
    .image-upload:hover { border-color: var(--accent); background: rgba(0,229,176,0.03); }
    .image-upload.has-image { border-style: solid; border-color: var(--accent); padding: 8px; }
    .image-upload img { max-width: 100%; max-height: 160px; border-radius: 6px; display: block; margin: 0 auto; }
    .image-upload .upload-placeholder { color: var(--sub); font-size: 0.82rem; }
    .image-upload .upload-placeholder .icon { font-size: 1.6rem; margin-bottom: 8px; }
    .preview-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; margin-top: 20px; display: none; }
    .preview-card.show { display: block; }
    .preview-card h3 { font-size: 0.8rem; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; }
    .preview-name { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
    .preview-meta { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--sub); margin: 6px 0; }
    .preview-desc { color: var(--sub2); font-size: 0.82rem; line-height: 1.6; margin-top: 8px; }
    @media (max-width: 640px) { body { padding: 20px 12px; } .card { padding: 20px; } h1 { font-size: 1.2rem; } .field-row { grid-template-columns: 1fr; gap: 0; } .btn-row { flex-direction: column; } .btn { width: 100%; text-align: center; } .inline-form { flex-direction: column; } .inline-form input { min-width: auto; } }
    @media (max-width: 400px) { .card { padding: 16px; } .product-item { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <div class="shell">
    <a href="/dashboard" class="nav-back">&larr; Back to Dashboard</a>
    <div class="card">
      <a href="/" style="display:flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:16px;">
        <img src="/static/tell5-icon.svg" alt="Tell5" style="width:28px;height:28px;border-radius:6px;" />
        <span style="font-size:1.15rem;font-weight:900;letter-spacing:-0.04em;color:var(--accent);">Tell5</span>
      </a>
      <h1>Business Profile</h1>
      <p class="sub">Set up your business to appear on the Tell5 discover page and let customers find you.</p>

      <div class="toast" id="toast"></div>

      <div class="field">
        <label>Business name</label>
        <input type="text" id="biz-name" placeholder="Your business name" />
      </div>

      <div class="field-row">
        <div class="field">
          <label>Category</label>
          <select id="biz-category">
            <option value="">Select category</option>
            <option value="retail">Retail</option>
            <option value="food">Food &amp; Beverage</option>
            <option value="tech">Technology</option>
            <option value="fashion">Fashion</option>
            <option value="health">Health &amp; Beauty</option>
            <option value="services">Services</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>Location</label>
          <input type="text" id="biz-address" placeholder="Lagos, Nigeria" />
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Phone (WhatsApp)</label>
          <input type="text" id="biz-phone" placeholder="+2348012345678" />
        </div>
        <div class="field">
          <label>Operating hours</label>
          <input type="text" id="biz-hours" placeholder="Mon-Fri 9AM-6PM" />
        </div>
      </div>

      <div class="field">
        <label>Website</label>
        <input type="text" id="biz-website" placeholder="https://example.com" />
      </div>

      <div class="field">
        <label>Business image</label>
        <div class="image-upload" id="image-upload" onclick="document.getElementById('image-input').click()">
          <input type="file" id="image-input" accept="image/*" style="display:none" onchange="previewImage(event)" />
          <div class="upload-placeholder" id="upload-placeholder">
            <div class="icon">🖼</div>
            <div>Click to upload business image</div>
          </div>
          <img id="image-preview" style="display:none" />
        </div>
      </div>

      <div class="field">
        <label>Description</label>
        <textarea id="biz-desc" placeholder="Tell customers about your business…" oninput="updateCharCount()"></textarea>
        <div class="char-count" id="char-count">0 / 500</div>
      </div>

      <div class="field">
        <label>Services offered</label>
        <textarea id="biz-services" placeholder="What do you offer? e.g. Website design, catering, fashion tailoring…" style="min-height:60px;"></textarea>
      </div>

      <div class="field">
        <label>Price range</label>
        <input type="text" id="biz-price-range" placeholder="e.g. ₦50,000 – ₦200,000 or $50 – $150" />
      </div>

      <div class="field">
        <label>Public profile</label>
        <div style="display:flex;align-items:center;gap:10px;margin-top:4px;">
          <input type="checkbox" id="biz-public" checked style="width:18px;height:18px;accent-color:var(--accent);" />
          <span style="color:var(--sub2);font-size:0.85rem;">Show on discover page</span>
        </div>
      </div>

      <div class="preview-card" id="preview-card">
        <h3>Preview</h3>
        <div class="preview-name" id="preview-name">Your Business Name</div>
        <div class="preview-meta" id="preview-meta">Category · Location</div>
        <div class="preview-desc" id="preview-desc">Description will appear here…</div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveProfile()">Save profile</button>
        <button class="btn btn-secondary" onclick="window.location.href='/dashboard'">Cancel</button>
      </div>

      <div id="profile-url"></div>

      <div style="margin-top:28px;padding-top:24px;border-top:1px solid var(--border);">
        <h2 style="font-size:1rem;font-weight:800;margin-bottom:12px;">Products &amp; Services</h2>
        <div id="product-list"></div>
        <div class="inline-form">
          <input type="text" id="prod-name" placeholder="Product name" />
          <input type="text" id="prod-currency" placeholder="NGN" style="max-width:60px;" value="NGN" />
          <input type="number" id="prod-price" placeholder="Price" style="max-width:120px;" />
          <button onclick="addProduct()">+ Add</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    
    /* ── CSRF helper ── */
    let _csrfToken = null;
    async function _ensureCsrf() {
      if (_csrfToken) return _csrfToken;
      try {
        const r = await fetch("/api/csrf-token", { credentials: "same-origin" });
        const d = await r.json();
        _csrfToken = { name: d.header_name, value: d.csrf_token };
        return _csrfToken;
      } catch { return null; }
    }
    const _origFetch = window.fetch;
    window.fetch = async function(url, opts) {
      opts = opts || {};
      if (opts.method && opts.method !== "GET" && opts.method !== "HEAD") {
        const csrf = await _ensureCsrf();
        if (csrf) {
          opts.headers = opts.headers || {};
          opts.headers[csrf.name] = csrf.value;
        }
      }
      return _origFetch(url, opts);
    };

    let profileId = null;
    let logoDataUrl = '';

    async function loadProfile() {
      try {
        const res = await fetch('/api/business/profile', { credentials: 'same-origin' });
        if (res.ok) {
          const data = await res.json();
          profileId = data.id;
          document.getElementById('biz-name').value = data.business_name || '';
          document.getElementById('biz-category').value = data.category || '';
          document.getElementById('biz-address').value = data.address || '';
          document.getElementById('biz-phone').value = data.phone || '';
          document.getElementById('biz-hours').value = data.hours || '';
          document.getElementById('biz-website').value = data.website || '';
          document.getElementById('biz-desc').value = data.description || '';
          document.getElementById('biz-services').value = data.services || '';
          document.getElementById('biz-price-range').value = data.price_range || '';
          document.getElementById('biz-public').checked = data.is_public !== false;
          if (data.logo_url) {
            logoDataUrl = data.logo_url;
            const preview = document.getElementById('image-preview');
            preview.src = data.logo_url;
            preview.style.display = 'block';
            document.getElementById('upload-placeholder').style.display = 'none';
            document.getElementById('image-upload').classList.add('has-image');
          }
          if (data.id) {
            document.getElementById('profile-url').style.display = 'block';
            document.getElementById('profile-url').innerHTML = 'Public URL: <a href="/business-profile/' + data.id + '" target="_blank">/business-profile/' + data.id + '</a>';
          }
          loadProducts();
        }
      } catch {}
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/business/products', { credentials: 'same-origin' });
        if (res.ok) {
          const data = await res.json();
          renderProducts(data || []);
        }
      } catch {}
    }

    function renderProducts(products) {
      const el = document.getElementById('product-list');
      if (!products.length) {
        el.innerHTML = '<div style="color:var(--sub);font-size:0.82rem;padding:8px 0;">No products yet. Add one below.</div>';
        return;
      }
      el.innerHTML = products.map(p => `
        <div class="product-item">
          <span class="name">${esc(p.name)}</span>
          <span class="price">${p.currency || 'NGN'} ${p.price || '—'}</span>
          <button class="del" onclick="removeProduct(${p.id})">✕</button>
        </div>
      `).join('');
    }

    async function saveProfile() {
      const btn = document.querySelector('.btn-primary');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        const res = await fetch('/api/business/profile', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({
            business_name: document.getElementById('biz-name').value.trim(),
            category: document.getElementById('biz-category').value,
            address: document.getElementById('biz-address').value.trim(),
            phone: document.getElementById('biz-phone').value.trim(),
            hours: document.getElementById('biz-hours').value.trim(),
            website: document.getElementById('biz-website').value.trim(),
            description: document.getElementById('biz-desc').value.trim(),
            services: document.getElementById('biz-services').value.trim(),
            price_range: document.getElementById('biz-price-range').value.trim(),
            is_public: document.getElementById('biz-public').checked,
            logo_url: logoDataUrl || undefined,
          }),
        });
        if (!res.ok) throw new Error('Failed to save');
        const data = await res.json();
        profileId = data.id;
        showToast('Profile saved!', 'success');
        document.getElementById('profile-url').style.display = 'block';
        document.getElementById('profile-url').innerHTML = 'Public URL: <a href="/business-profile/' + data.id + '" target="_blank">/business-profile/' + data.id + '</a>';
      } catch (err) {
        showToast('Error saving profile: ' + err.message, 'error');
      }
      btn.disabled = false; btn.textContent = 'Save profile';
    }

    async function addProduct() {
      const name = document.getElementById('prod-name').value.trim();
      const price = document.getElementById('prod-price').value.trim();
      const currency = document.getElementById('prod-currency').value.trim().toUpperCase() || 'NGN';
      if (!name || !price) return;
      try {
        const res = await fetch('/api/business/products', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ name, price: parseFloat(price), currency }),
        });
        if (!res.ok) throw new Error('Failed to add');
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-price').value = '';
        loadProducts();
      } catch (err) {
        showToast('Error adding product: ' + err.message, 'error');
      }
    }

    async function removeProduct(id) {
      if (!confirm('Remove this product?')) return;
      try {
        const res = await fetch('/api/business/products/' + id, { method: 'DELETE', credentials: 'same-origin' });
        if (!res.ok) throw new Error('Failed to delete');
        loadProducts();
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
      }
    }

    function showToast(msg, type) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast toast-' + type + ' show';
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }

    function updateCharCount() {
      const el = document.getElementById('biz-desc');
      const count = el.value.length;
      const cc = document.getElementById('char-count');
      cc.textContent = count + ' / 500';
      cc.className = 'char-count' + (count > 500 ? ' over' : count > 400 ? ' warn' : '');
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const maxSize = 2 * 1024 * 1024; // 2 MB
      const allowedTypes = ["image/png", "image/jpeg", "image/webp", "image/svg+xml"];
      if (!allowedTypes.includes(file.type)) {
        showToast("Unsupported file type. Use PNG, JPEG, WebP, or SVG.", "error");
        event.target.value = "";
        return;
      }
      if (file.size > maxSize) {
        showToast("File too large. Maximum size is 2 MB.", "error");
        event.target.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        logoDataUrl = e.target.result;
        const preview = document.getElementById('image-preview');
        preview.src = logoDataUrl;
        preview.style.display = 'block';
        document.getElementById('upload-placeholder').style.display = 'none';
        document.getElementById('image-upload').classList.add('has-image');
      };
      reader.readAsDataURL(file);
    }

    function updatePreview() {
      const name = document.getElementById('biz-name').value.trim() || 'Your Business Name';
      const cat = document.getElementById('biz-category').value;
      const addr = document.getElementById('biz-address').value.trim();
      const desc = document.getElementById('biz-desc').value.trim() || 'Description will appear here…';
      document.getElementById('preview-name').textContent = name;
      document.getElementById('preview-meta').textContent = [cat, addr].filter(Boolean).join(' · ') || 'Category · Location';
      document.getElementById('preview-desc').textContent = desc;
      document.getElementById('preview-card').classList.toggle('show', !!(name || cat || addr || desc));
    }

    ['biz-name', 'biz-category', 'biz-address', 'biz-desc'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    loadProfile();
  </script>
</body>
</html>
