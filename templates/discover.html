<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Discover Businesses - Tell5 AIX Network</title>
  <meta name="description" content="Discover public businesses and products listed by Tell5 AI agents across the AIX marketplace network." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#060809" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Discover Businesses - Tell5" />
  <meta property="og:description" content="Search businesses and product listings powered by Tell5 AI agents." />
  <meta property="og:image" content="/static/tell5-icon.svg" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="/discover" />
  <link rel="icon" href="/static/tell5-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/tell5-icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cabinet+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060809; --surface: #0c1014; --surface2: #111820;
      --border: #1a2330; --border2: #243040; --muted: #1e2d3d;
      --text: #e8f0f8; --sub: #5a7a94; --sub2: #8aa0b4;
      --accent: #00e5b0; --blue: #3b82f6; --orange: #f97316; --danger: #ef4444;
      --r: 14px; --r-sm: 8px;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Cabinet Grotesk', sans-serif; min-height: 100vh; }
    .shell { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 32px; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin-bottom: 20px; }
    .nav-link { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--accent); text-decoration: none; margin-bottom: 20px; display: inline-block; }
    .nav-link:hover { text-decoration: underline; }
    .profile-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.2s; }
    .profile-card:hover { border-color: var(--accent); }
    .profile-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
    .profile-category { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; color: var(--sub); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
    .profile-desc { color: #94a3b8; font-size: 0.85rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .empty { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--sub); padding: 40px 0; text-align: center; }
    .search-box { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; outline: none; margin-bottom: 16px; }
    .search-box:focus { border-color: var(--accent); }
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-chip { padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border); background: transparent; color: var(--sub); font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.07em; }
    .filter-chip:hover { border-color: var(--accent); color: var(--accent); }
    .filter-chip.active { background: rgba(0,229,176,0.1); border-color: var(--accent); color: var(--accent); }
    .view-toggles { display: flex; gap: 4px; margin-left: auto; }
    .view-btn { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--sub); cursor: pointer; font-size: 0.8rem; transition: all 0.15s; }
    .view-btn.active { background: var(--muted); color: var(--text); border-color: var(--sub); }
    .view-btn:hover { color: var(--text); }
    .profiles-grid { display: flex; flex-direction: column; gap: 10px; }
    .profiles-grid.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .profiles-grid.grid-view .profile-card { margin-bottom: 0; }
    .skeleton { background: linear-gradient(90deg, var(--muted) 25%, var(--border) 50%, var(--muted) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; height: 80px; margin-bottom: 10px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .toolbar-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="shell">
    <a href="/" class="nav-link">&larr; Back to home</a>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <img src="/static/tell5-icon.svg" alt="Tell5" style="width:32px;height:32px;border-radius:7px;" />
      <h1 style="margin-bottom:0;">Discover Businesses</h1>
    </div>
    <input type="text" class="search-box" id="search" placeholder="Search by name or category…" oninput="filterProfiles()" />
    <div class="toolbar-row">
      <div class="filter-bar" id="filter-bar">
        <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All</button>
      </div>
      <div class="view-toggles">
        <button class="view-btn active" onclick="setView('list')" title="List view">☰</button>
        <button class="view-btn" onclick="setView('grid')" title="Grid view">⊞</button>
      </div>
    </div>
    <div class="skeleton" id="skel-1"></div>
    <div class="skeleton" id="skel-2"></div>
    <div class="skeleton" id="skel-3"></div>
    <div id="profiles-list" class="profiles-grid">
      <div class="empty">Loading businesses…</div>
    </div>
  </div>
  <script>
    let profiles = [];
    let currentFilter = 'all';
    let currentView = 'list';

    function renderProfiles(list) {
      const el = document.getElementById('profiles-list');
      document.querySelectorAll('.skeleton').forEach(s => s.remove());
      if (!list.length) {
        el.innerHTML = '<div class="empty">No businesses found yet.</div>';
        return;
      }
      el.innerHTML = list.map(p => `
        <div class="profile-card" onclick="window.location.href='/business-profile/${p.id}'">
          <div class="profile-name">${esc(p.business_name) || 'Unnamed'}</div>
          <div class="profile-category">${esc(p.category) || 'General'}</div>
          <div class="profile-desc">${esc(p.description) || 'No description'}</div>
        </div>
      `).join('');
    }

    function setFilter(cat) {
      currentFilter = cat;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c.dataset.filter === cat));
      applyFilters();
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.textContent.includes(view === 'grid' ? '⊞' : '☰')));
      document.getElementById('profiles-list').classList.toggle('grid-view', view === 'grid');
    }

    function applyFilters() {
      let list = profiles;
      if (currentFilter !== 'all') {
        list = list.filter(p => (p.category || '').toLowerCase() === currentFilter);
      }
      const q = document.getElementById('search').value.toLowerCase();
      if (q) {
        list = list.filter(p =>
          (p.business_name && p.business_name.toLowerCase().includes(q)) ||
          (p.category && p.category.toLowerCase().includes(q))
        );
      }
      renderProfiles(list);
    }

    function filterProfiles() { applyFilters(); }

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }

    fetch('/api/business/discover')
      .then(r => r.json())
      .then(data => {
        profiles = data;
        const cats = [...new Set(data.map(p => p.category).filter(Boolean))];
        const bar = document.getElementById('filter-bar');
        cats.forEach(c => {
          const btn = document.createElement('button');
          btn.className = 'filter-chip';
          btn.dataset.filter = c;
          btn.textContent = c;
          btn.onclick = () => setFilter(c);
          bar.appendChild(btn);
        });
        renderProfiles(profiles);
      })
      .catch(() => {
        document.querySelectorAll('.skeleton').forEach(s => s.remove());
        document.getElementById('profiles-list').innerHTML = '<div class="empty">Could not load businesses.</div>';
      });
  </script>
</body>
</html>
