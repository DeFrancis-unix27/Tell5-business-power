<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reset Password — Tell5</title>
  <meta name="theme-color" content="#060809"/>
  <link rel="icon" href="/static/tell5-icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Cabinet+Grotesk:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#060809;--s1:#0b1118;--s2:#0f1820;--b1:#1c2c3c;--ac:#00e5b0;--ac2:rgba(0,229,176,0.08);--t1:#eaf2fb;--t2:#9ab4c8;--t3:#4e6a80;--mono:'IBM Plex Mono',monospace;--sans:'Cabinet Grotesk',sans-serif}
    body{background:var(--bg);color:var(--t1);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .card{background:var(--s1);border:1px solid var(--b1);border-radius:14px;padding:36px 32px;width:100%;max-width:400px;margin:24px}
    .brand{display:flex;align-items:center;gap:8px;text-decoration:none;margin-bottom:24px;font-size:1.2rem;font-weight:900;color:var(--t1);letter-spacing:-.04em}
    .brand img{width:24px;height:24px}
    .brand em{font-style:normal;color:var(--ac)}
    h1{font-size:1.3rem;font-weight:900;margin-bottom:6px;letter-spacing:-.03em}
    p{font-size:.82rem;color:var(--t2);line-height:1.6;margin-bottom:20px}
    label{display:block;font-family:var(--mono);font-size:.6rem;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
    input{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--b1);background:var(--s2);color:var(--t1);font-size:.88rem;font-family:inherit;outline:none;transition:border-color .15s;margin-bottom:16px}
    input:focus{border-color:var(--ac)}
    button{width:100%;padding:13px;border-radius:8px;border:none;background:var(--ac);color:#04060a;font-weight:800;font-size:.88rem;cursor:pointer;font-family:inherit;transition:opacity .15s}
    button:hover{opacity:.85}
    button:disabled{opacity:.5;cursor:not-allowed}
    .error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#ef4444;padding:10px 14px;border-radius:8px;font-size:.78rem;display:none;margin-bottom:16px}
    .error.show{display:block}
    .success{background:var(--ac2);border:1px solid rgba(0,229,176,0.2);color:var(--ac);padding:10px 14px;border-radius:8px;font-size:.78rem;display:none;margin-bottom:16px;text-align:center}
    .success.show{display:block}
    .success a{color:var(--ac);text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <a class="brand" href="/">
      <img src="/static/tell5-icon.svg" alt="Tell5">
      Tell<em>5</em>
    </a>
    <h1>Set new password</h1>
    <p>Choose a new password for your account. Must be at least 8 characters.</p>
    <div class="error" id="error">Something went wrong.</div>
    <div class="success" id="success">Password updated! <a href="/">Go to login →</a></div>
    <label for="pass">New password</label>
    <input type="password" id="pass" placeholder="Min. 8 characters" autocomplete="new-password" />
    <label for="pass2">Confirm password</label>
    <input type="password" id="pass2" placeholder="Repeat password" autocomplete="new-password" />
    <button id="btn" onclick="handleReset()">Reset password →</button>
  </div>
  <script>
    const TOKEN = '{{TOKEN}}';
    // Guard: if Jinja2 didn't render the token, show an error
    if (!TOKEN || TOKEN === '{{TOKEN}}') {
      document.getElementById('error').textContent = 'Invalid or missing reset token. Please request a new password reset link.';
      document.getElementById('error').classList.add('show');
      document.getElementById('btn').disabled = true;
    }
    async function handleReset() {
      const pass = document.getElementById('pass').value;
      const pass2 = document.getElementById('pass2').value;
      const errEl = document.getElementById('error');
      const btn = document.getElementById('btn');
      errEl.classList.remove('show');
      if (!pass || pass.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        return errEl.classList.add('show');
      }
      if (pass !== pass2) {
        errEl.textContent = 'Passwords do not match.';
        return errEl.classList.add('show');
      }
      btn.disabled = true; btn.textContent = 'Resetting…';
      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({token: TOKEN, password: pass})
        });
        const d = await r.json();
        if (!r.ok) throw new Error(d.detail || 'Failed to reset password.');
        document.getElementById('success').classList.add('show');
        btn.style.display = 'none';
        document.getElementById('pass').style.display = 'none';
        document.getElementById('pass2').style.display = 'none';
        document.querySelector('label').style.display = 'none';
        document.querySelectorAll('label')[1].style.display = 'none';
        document.querySelector('p').textContent = 'Your password has been updated successfully.';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
        btn.disabled = false; btn.textContent = 'Reset password →';
      }
    }
  </script>
</body>
</html>
